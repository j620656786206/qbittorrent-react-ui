name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # check.sh diffs against the base branch.
          fetch-depth: 0

      # The repo is public: no credentials, home addresses, private category
      # names or em dashes, also for PRs that did not go through /ship.
      - name: Public-repo check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .claude/skills/next-story/check.sh "origin/$BASE_REF"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: node --check scripts/fake-qbit.mjs
      - run: npm run build
      # Boots .output: CSP nonce on HTML, asset CSP, refuses to start without env.
      - run: npm run smoke
      # The build regenerates the route tree; a stale committed copy fails here.
      - run: git diff --exit-code src/routeTree.gen.ts
