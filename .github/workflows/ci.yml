name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # check.sh diffs against the base branch.
          fetch-depth: 0

      # The repo is public: no credentials, home addresses, private category
      # names or em dashes, also for PRs that did not go through /ship.
      - name: Public-repo check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .claude/skills/next-story/check.sh "origin/$BASE_REF"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # npm audit --omit=dev --audit-level=high, minus the dated skips in
      # scripts/audit.mjs (one advisory with no fixed release, 2026-11-18).
      - run: npm run audit:prod
      - run: node --check scripts/fake-qbit.mjs
      - run: npm run build
      # Boots .output: CSP nonce on HTML, asset CSP, refuses to start without env.
      - run: npm run smoke
      # Story 2.0: the Playwright browser smoke (Chromium only) against the
      # built server behind scripts/fake-qbit.mjs, which only talks to its
      # own fake qBittorrent (AD-15). No .env, no real credentials.
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:browser
      # Light and dark screenshots at 1440px and 390px, plus the report.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-smoke
          path: |
            e2e-output/screenshots/
            playwright-report/
          retention-days: 14
      # The build regenerates the route tree; a stale committed copy fails here.
      - run: git diff --exit-code src/routeTree.gen.ts
      # AR-11: the image built from this PR's merge commit (github.sha), with
      # the same Dockerfile and smoke as main, run with fake env and the
      # hardened Unraid flags. Never pushed or logged in to a registry here.
      - run: node --check scripts/smoke-image.mjs
      - run: docker build --platform linux/amd64 --build-arg COMMIT_SHA=${{ github.sha }} -t react-torrent:ci .
      - run: node scripts/smoke-image.mjs react-torrent:ci ${{ github.sha }}
